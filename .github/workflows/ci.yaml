name: Test with ScyllaDB

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 26.x]
    env:
      SCYLLA_HOSTNAME: localhost
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: admin
      SCYLLA_PASSWORD: admin
      SCYLLA_KEYSPACE: test
      SCYLLA_DATACENTER: datacenter1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start ScyllaDB
        uses: azita-abdollahi/scylladb-action@v2.0.0
        with:
          host: localhost
          # everything else (admin/admin, keyspace "test", port 9042) = action defaults

      - name: Install dependencies
        run: npm ci        

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
      
      - name: Example smoke test 
        run: node examples/index.js